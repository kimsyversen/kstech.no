<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Kstech</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0F0D0B">
<link rel="icon" href="/assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/fonts.css">
<style>
  :root{
    --ink:#0F0D0B; --line:#26221E; --bone:#EAE5DB; --mist:#938C82;
    --serif:"Fraunces", Georgia, serif;
    --mono:"Spline Sans Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:var(--ink); color:var(--bone);
    min-height:100svh; display:grid; place-items:center;
    font-family:var(--mono); padding:24px;
  }
  main{ max-width:560px; }
  .code{ font-size:12px; letter-spacing:.22em; color:var(--mist); margin-bottom:20px; }
  h1{
    font-family:var(--serif); font-weight:430;
    font-size:clamp(34px, 7vw, 56px); line-height:1.05;
  }
  h1 em{ font-style:italic; font-weight:560; }
  p{ margin-top:22px; color:var(--mist); font-size:13.5px; line-height:1.7; }
  a{
    color:var(--bone); text-decoration:none;
    border-bottom:1px solid var(--line); padding-bottom:1px;
  }
  a:hover{ border-bottom-color:var(--bone); }
  :focus-visible{ outline:2px solid var(--bone); outline-offset:3px; }
</style>
</head>
<body>
<main>
  <p class="code">404 · NOT FOUND</p>
  <h1>This page doesn't exist.</h1>
  <p>The address may have changed when the apps moved under one roof.<br>
  <a href="/">Back to all apps</a> · <a href="/support/">Support</a></p>
</main>
</body>
</html>
